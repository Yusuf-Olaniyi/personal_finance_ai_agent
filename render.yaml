services:
  - type: web
    name: ai-financial-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_DAILY_CAP
        value: "100"
      - key: DEMO_COOLDOWN_SECONDS
        value: "30"